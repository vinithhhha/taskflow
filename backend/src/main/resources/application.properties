# ── Server ──────────────────────────────────────────────
server.port=${PORT:8080}

# ── Database (XAMPP local default / Railway via env vars) ──
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskflow?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:taskflow_super_secret_key_must_be_at_least_256_bits_long_1234567890}
app.jwt.expiration-ms=604800000

# ── CORS (allow React dev server + production) ────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Logging ──────────────────────────────────────────────
logging.level.com.taskflow=INFO
